<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="text-align: center;">Stop Watch</h1>
    <div class="stopwatch">
            <h1 id ="timer" style="font-size: 50px;">00 : 00 : 00 : 000</h1>
           <div class="buttonbox">
                 <button class="start-btn" onclick="start();"><b>Start</b></button>
            <button class="stop-btn" onclick="stop();"><b>Stop</b></button>
            <button class="reset-btn" onclick="reset();"><b>Reset</b></button>
           </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
